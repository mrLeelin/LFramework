<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>类索引与调用关系 - LFramework Wiki</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Class Index</p>
      <h1>类索引与调用关系</h1>
      <p class="summary">覆盖 LFramework 与 UnityGameFramework 的 C# 类型，可按类名、命名空间、路径检索，并查看引用与被引用关系。</p>
    </div>
  </header>

  <main class="layout">
    <nav class="nav">
      <a href="index.html">总览</a>
      <a href="startup-flow.html">启动流程</a>
      <a href="configuration.html">配置整理</a>
      <a href="runtime-systems.html">模块详解</a>
      <a href="module-tree.html">模块树</a>
      <a href="worldhelper-guide.html">WorldHelper</a>
      <a href="class-index.html" class="active">类索引</a>
      <a href="resource-and-build.html">资源与构建</a>
      <a href="newcomer-checklist.html">新人清单</a>
    </nav>

    <article class="content class-index">
      <section class="toolbar">
        <input id="searchBox" type="search" placeholder="搜索类名、命名空间、路径、基类、Attribute">
        <select id="kindFilter">
          <option value="">全部类型</option>
          <option value="class">class</option>
          <option value="interface">interface</option>
          <option value="struct">struct</option>
          <option value="enum">enum</option>
        </select>
      </section>

      <p id="stats" class="muted"></p>

      <section class="class-grid">
        <div class="class-list" id="classList"></div>
        <div class="class-detail" id="classDetail">
          <h2>选择一个类型</h2>
          <p>左侧搜索或点击类型后，这里会显示路径、基类/接口、Attribute、方法、引用关系和被引用关系。</p>
        </div>
      </section>
    </article>
  </main>

  <script src="class-index-data.js"></script>
  <script>
    const data = window.LFRAMEWORK_CLASS_INDEX || { stats: {}, types: [] };
    const types = data.types || [];
    const byQualified = new Map(types.map(type => [type.qualifiedName, type]));
    const searchBox = document.getElementById("searchBox");
    const kindFilter = document.getElementById("kindFilter");
    const classList = document.getElementById("classList");
    const classDetail = document.getElementById("classDetail");
    const stats = document.getElementById("stats");

    stats.textContent = `范围：${data.stats.scope || ""}，文件：${data.stats.fileCount || 0}，类型：${data.stats.typeCount || types.length}，生成时间：${data.stats.generatedAt || ""}`;

    function normalize(value) {
      return (value || "").toString().toLowerCase();
    }

    function searchableText(type) {
      return [
        type.name,
        type.qualifiedName,
        type.namespace,
        type.kind,
        type.path,
        ...(type.bases || []),
        ...(type.attributes || [])
      ].join(" ");
    }

    function getFilteredTypes() {
      const query = normalize(searchBox.value);
      const kind = kindFilter.value;
      return types.filter(type => {
        if (kind && type.kind !== kind) return false;
        if (!query) return true;
        return normalize(searchableText(type)).includes(query);
      }).slice(0, 500);
    }

    function renderList() {
      const filtered = getFilteredTypes();
      classList.innerHTML = "";
      const count = document.createElement("div");
      count.className = "list-count";
      count.textContent = `显示 ${filtered.length} / ${types.length}`;
      classList.appendChild(count);

      for (const type of filtered) {
        const button = document.createElement("button");
        button.className = "class-row";
        button.type = "button";
        button.innerHTML = `<strong>${escapeHtml(type.name)}</strong><span>${escapeHtml(type.namespace || "<global>")}</span><em>${escapeHtml(type.kind)}</em>`;
        button.addEventListener("click", () => renderDetail(type));
        classList.appendChild(button);
      }
    }

    function renderDetail(type) {
      const references = (type.references || []).map(name => findTypeLinksByName(name)).join("");
      const referencedBy = (type.referencedBy || []).map(name => {
        const target = byQualified.get(name);
        return target ? typeLink(target) : `<li>${escapeHtml(name)}</li>`;
      }).join("");

      classDetail.innerHTML = `
        <h2>${escapeHtml(type.name)}</h2>
        <p class="qualified">${escapeHtml(type.qualifiedName)}</p>
        <dl class="meta-list">
          <dt>类型</dt><dd>${escapeHtml(type.kind)}</dd>
          <dt>路径</dt><dd><code>${escapeHtml(type.path)}</code></dd>
          <dt>基类/接口</dt><dd>${renderPills(type.bases)}</dd>
          <dt>Attributes</dt><dd>${renderPills(type.attributes)}</dd>
        </dl>

        <h3>方法</h3>
        ${renderListItems(type.methods, "未解析到方法声明")}

        <h3>引用的类型</h3>
        <ul class="relation-list">${references || "<li>未发现对其他索引类型的引用</li>"}</ul>

        <h3>被这些类型引用</h3>
        <ul class="relation-list">${referencedBy || "<li>未发现被其他索引类型引用</li>"}</ul>
      `;

      classDetail.querySelectorAll("[data-qualified]").forEach(node => {
        node.addEventListener("click", () => {
          const target = byQualified.get(node.getAttribute("data-qualified"));
          if (target) renderDetail(target);
        });
      });
    }

    function findTypeLinksByName(name) {
      const matches = types.filter(type => type.name === name);
      if (matches.length === 0) return `<li>${escapeHtml(name)}</li>`;
      return matches.map(typeLink).join("");
    }

    function typeLink(type) {
      return `<li><button type="button" data-qualified="${escapeHtml(type.qualifiedName)}">${escapeHtml(type.qualifiedName)}</button><span>${escapeHtml(type.path)}</span></li>`;
    }

    function renderPills(values) {
      if (!values || values.length === 0) return "<span class=\"muted\">无</span>";
      return values.map(value => `<span class="pill">${escapeHtml(value)}</span>`).join("");
    }

    function renderListItems(values, emptyText) {
      if (!values || values.length === 0) return `<p class="muted">${emptyText}</p>`;
      return `<ul>${values.map(value => `<li><code>${escapeHtml(value)}</code></li>`).join("")}</ul>`;
    }

    function escapeHtml(value) {
      return (value || "").toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    searchBox.addEventListener("input", renderList);
    kindFilter.addEventListener("change", renderList);
    renderList();
  </script>
</body>
</html>
